name: Build Cross-Platform Runtimes

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  cross-compile:
    name: Runtime (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: wasi
            flags: -DMOKSHA_TARGET=wasi
          - target: wasm_web
            flags: -DMOKSHA_TARGET=wasm_web
          - target: baremetal-x86_64
            flags: -DMOKSHA_TARGET=baremetal -DMOKSHA_ARCH=x86_64 -DMOKSHA_PLATFORM=qemu_virt
          - target: baremetal-uefi
            flags: -DMOKSHA_TARGET=baremetal -DMOKSHA_ARCH=x86_64 -DMOKSHA_PLATFORM=uefi
          - target: android-arm64
            flags: -DMOKSHA_TARGET=linux

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install Base Toolchains
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build clang gcc-multilib

      # ----------------------------------------------------
      # Setup WASI SDK
      # ----------------------------------------------------
      - name: Setup WASI SDK
        if: matrix.target == 'wasi'
        run: |
          wget https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-20/wasi-sdk-20.0-linux.tar.gz
          tar xvf wasi-sdk-20.0-linux.tar.gz
          echo "WASI_SDK_PREFIX=$(pwd)/wasi-sdk-20.0" >> $GITHUB_ENV

      # ----------------------------------------------------
      # Setup Emscripten (for wasm_web)
      # ----------------------------------------------------
      - name: Setup Emscripten
        if: matrix.target == 'wasm_web'
        uses: mymindstorm/setup-emsdk@v14

      # ----------------------------------------------------
      # Setup Android NDK
      # ----------------------------------------------------
      - name: Setup Android NDK
        if: matrix.target == 'android-arm64'
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b

      # ----------------------------------------------------
      # Build Phase
      # ----------------------------------------------------
      - name: Configure and Build Runtime
        run: |
          if [ "${{ matrix.target }}" == "wasi" ]; then
            cmake -B build-rt -S runtime -G Ninja ${{ matrix.flags }} \
              -DCMAKE_TOOLCHAIN_FILE=$WASI_SDK_PREFIX/share/cmake/wasi-sdk.cmake \
              -DWASI_SDK_PREFIX=$WASI_SDK_PREFIX
          elif [ "${{ matrix.target }}" == "wasm_web" ]; then
            emcmake cmake -B build-rt -S runtime -G Ninja ${{ matrix.flags }}
          elif [ "${{ matrix.target }}" == "android-arm64" ]; then
            cmake -B build-rt -S runtime -G Ninja ${{ matrix.flags }} \
              -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
              -DANDROID_ABI=arm64-v8a
          else
            cmake -B build-rt -S runtime -G Ninja ${{ matrix.flags }} \
              -DCMAKE_C_COMPILER=clang \
              -DCMAKE_SYSTEM_NAME=Generic \
              -DCMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY
          fi
          cmake --build build-rt

      - name: Upload Runtime Archive
        uses: actions/upload-artifact@v4
        with:
          name: libmoksha_rt_${{ matrix.target }}
          path: build-rt/*.a
